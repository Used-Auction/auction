<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<div class="login-container">
    <h2>로그인</h2>

    <!-- 에러 메시지 표시 -->
    <p th:if="${param.error}" class="error-message">이메일 또는 비밀번호가 잘못되었습니다.</p>

    <!-- 로그인 폼 -->
    <form action="/users/login" method="post" th:action="@{/accounts/login}">
        <input type="email" name="email" placeholder="이메일" required />
        <input type="password" name="password" placeholder="비밀번호" required />

        <button type="submit">로그인</button>
    </form>

    <!-- 회원가입 링크 -->
    <p class="register-link">아직 회원이 아니신가요? <a th:href="@{/user/join}">회원가입</a></p>
</div>

</body>
</html>
